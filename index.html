<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Felix Pasillas" />
    <meta name="description" content="Flashcards to help students study" />
    <meta name="keywords" content="study cards, quiz cards" />
    <title>FlashMind AI</title>

    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="assets/css/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Slab:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a href="#home" class="header__link">Flash Cards</a>
      </h1>
      <div>
        <nav class="nav">
          <ul class="nav__links">
            <li><a class="nav__link" href="#">About</a></li>
            <li><a class="nav__link" href="#home">My Decks</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="page__main-content">
      <section id="home" class="gallery">
        <h2 class="gallery__title">My Decks</h2>

        <ul class="gallery__list">
          <template id="deck-template">
            <li class="card card_color_green">
              <a class="card__link" href="#"></a>
              <h3 class="card__title">Basic HTML Tags</h3>
              <div class="card__row">
                <p class="card__count">10 cards</p>

                <button
                  class="gallery__delete-btn"
                  aria-label="Delete this deck"
                ></button>
              </div>
            </li>
          </template>
        </ul>

        <button
          class="button gallery__new-deck-btn gallery__new-image-btn"
          type="button"
        >
          + New Deck
        </button>
      </section>

      <section id="deck-view" class="gallery">
        <div class="gallery__header">
          <h2 class="gallery__title"></h2>

          <div class="gallery__actions">
            <button
              class="gallery__new-button gallery__new-card-btn gallery__new-card-btn_location_deck-view"
              type="button"
            >
              + New Card
            </button>

            <a class="button gallery__practice-btn" href="#">Practice</a>
          </div>
        </div>

        <ul class="gallery__list">
          <template id="flashcard-template">
            <li class="card card_color_green">
              <h3 class="card__title">What does HTML stand for?</h3>
              <div class="card__row"></div>
            </li>
          </template>
        </ul>
      </section>
      <section id="not-found" class="hidden">
        <h2>404 Not Found</h2>
        <p>The page you are looking for does not exist.</p>
      </section>
      <section class="carousel">
        <h2 class="carousel__title">HTML Tags Deck &middot; 1/10</h2>

        <div class="carousel__grid">
          <button
            class="carousel__btn carousel__btn_type_left"
            type="button"
            aria-label="Previous card"
          ></button>

          <div class="carousel__card">
            <p class="carousel__card-text">&lt;body&gt;&lt;/body&gt;</p>
          </div>

          <button
            class="carousel__btn carousel__btn_type_right"
            type="button"
            aria-label="Next card"
          ></button>

          <button
            class="carousel__btn carousel__btn_type_flip"
            type="button"
            aria-label="Flip card"
          ></button>
        </div>
      </section>
      <section id="new-deck-view">
        <h2>New Deck</h2>
        <form class="new-deck-view__form">
          <fieldset class="new-deck-view__color-picker">
            <legend class="new-deck-view__legend">Pick the deck color</legend>
            <label class="new-deck-view__color-label" for="green">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_green"
                aria-label="Green"
                name="color"
                id="green"
                value="#64D583"
                type="radio"
                checked
              />
            </label>
            <label class="new-deck-view__color-label" for="blue">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_blue"
                aria-label="Blue"
                name="color"
                id="blue"
                value="#91A8F9"
                type="radio"
              />
            </label>
            <label class="new-deck-view__color-label" for="purple">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_purple"
                aria-label="Purple"
                name="color"
                id="purple"
                value="#AA8EF0"
                type="radio"
              />
            </label>
            <label class="new-deck-view__color-label" for="pink">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_pink"
                aria-label="Pink"
                name="color"
                id="pink"
                value="#EE92D7"
                type="radio"
              />
            </label>
            <label class="new-deck-view__color-label" for="orange">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_orange"
                aria-label="Orange"
                name="color"
                id="orange"
                value="#EE955E"
                type="radio"
              />
            </label>
            <label class="new-deck-view__color-label" for="yellow">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_yellow"
                aria-label="Yellow"
                name="color"
                id="yellow"
                value="#F5D770"
                type="radio"
              />
            </label>
          </fieldset>
          <label>
            Write the JSON array of cards so that it matches this schema
            <textarea class="new-deck-view__textarea" id="deck-json">
            </textarea>
          </label>
          <button class="new-deck-view__submit" type="submit" disabled>
            Create the Deck
          </button>
        </form>
      </section>
    </main>

    <div class="modal_visible" id="error-modal">
      <div class="modal__block">
        <h2 class="modal__title">Error</h2>
        <p class="modal__error"></p>
        <button class="modal__close" type="button"></button>
      </div>
    </div>

    <footer class="footer">
      <p class="footer__text">&copy; 2026 Felix Pasillas</p>
    </footer>
    <script type="module" src="./assets/js/index.js"></script>
  </body>
</html>
